version: "1.0"

store:
  package: "store"
  output_dir: "stores"
  interface: "Store"
  implementation: "store"

models:
  - name: "User"
    fields:
      - name: "ID"
        type: "int64"
        tag: "db:\"id\" json:\"id\""
      - name: "Name"
        type: "string"
        tag: "db:\"name\" json:\"name\""
      - name: "Email"
        type: "string"
        tag: "db:\"email\" json:\"email\""
      - name: "CreatedAt"
        type: "time.Time"
        tag: "db:\"created_at\" json:\"created_at\""
      - name: "UpdatedAt"
        type: "time.Time"
        tag: "db:\"updated_at\" json:\"updated_at\""

  - name: "Product"
    fields:
      - name: "ID"
        type: "int64"
        tag: "db:\"id\" json:\"id\""
      - name: "Name"
        type: "string"
        tag: "db:\"name\" json:\"name\""
      - name: "Price"
        type: "float64"
        tag: "db:\"price\" json:\"price\""
      - name: "Description"
        type: "string"
        tag: "db:\"description\" json:\"description\""
      - name: "CreatedAt"
        type: "time.Time"
        tag: "db:\"created_at\" json:\"created_at\""

queries:
  - name: "GetUserByID"
    sql: "SELECT id, name, email, created_at, updated_at FROM users WHERE id = ?"
    type: "select"
    model: "User"
    returns: "single"
    params:
      - name: "id"
        type: "int64"
    description: "Retrieves a user by their ID"

  - name: "GetAllUsers"
    sql: "SELECT id, name, email, created_at, updated_at FROM users ORDER BY created_at DESC"
    type: "select"
    model: "User"
    returns: "multiple"
    description: "Retrieves all users ordered by creation date"

  - name: "CreateUser"
    sql: "INSERT INTO users (name, email, created_at, updated_at) VALUES (?, ?, NOW(), NOW())"
    type: "insert"
    model: "User"
    returns: "single"
    params:
      - name: "name"
        type: "string"
      - name: "email"
        type: "string"
    description: "Creates a new user"

  - name: "UpdateUser"
    sql: "UPDATE users SET name = ?, email = ?, updated_at = NOW() WHERE id = ?"
    type: "update"
    returns: "count"
    params:
      - name: "name"
        type: "string"
      - name: "email"
        type: "string"
      - name: "id"
        type: "int64"
    description: "Updates an existing user"

  - name: "DeleteUser"
    sql: "DELETE FROM users WHERE id = ?"
    type: "delete"
    returns: "count"
    params:
      - name: "id"
        type: "int64"
    description: "Deletes a user by ID"

  - name: "GetUserCount"
    sql: "SELECT COUNT(*) FROM users"
    type: "select"
    returns: "count"
    description: "Returns the total number of users"

  - name: "GetProductsByPriceRange"
    sql: "SELECT id, name, price, description, created_at FROM products WHERE price BETWEEN ? AND ? ORDER BY price ASC"
    type: "select"
    model: "Product"
    returns: "multiple"
    params:
      - name: "minPrice"
        type: "float64"
      - name: "maxPrice"
        type: "float64"
    description: "Retrieves products within a price range"
